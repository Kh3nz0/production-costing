name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      # --frozen-lockfile fails the build if the lockfile and package.json
      # disagree, which is how versions stay pinned.
      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
